name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - run: pip install -r requirements.txt

      # No linter or test suite exists in this repo yet; this is the only
      # automated check currently available (catches syntax errors).
      - name: Syntax check
        run: python -m py_compile run.py generator.py
